- name: "Caragh Morgan"
  role: "Chairperson"
  image: "/assets/img/committee/caragh-morgan.png"
  blurb: "Caragh is a legal practice director with extensive experience in family law and child advocacy. She has served in community leadership roles and brings a strong commitment to child wellbeing, equity and community service."
- name: "Siobhan Cadogan"
  role: "Deputy Chairperson"
  image: "/assets/img/committee/siobhan-cadogan.png"
  blurb: "Siobhan is a consumer engagement coordinator with a background in health promotion, youth work and service reform. She has a long-standing commitment to child and family wellbeing and brings strong governance and community engagement experience."
- name: "Jenny Hutson"
  role: "Secretary"
  image: "/assets/img/committee/jenny-hutson.png"
  blurb: "Jenny is a registered child health nurse who supports families and children from birth to school entry. Her experience in community health, nursing leadership and early intervention makes her a strong advocate for quality early childhood education."
- name: "Jason Pang"
  role: "Treasurer"
  blurb: "Jason is a business management specialist with experience in operational and financial oversight. He is supporting the association with practical stewardship and a strong understanding of sustainable community organisation management."
- name: "Dr Emily South"
  role: "Committee Member"
  blurb: "Dr Emily South is a clinical psychologist with specialist expertise in child, adolescent and family mental health. Her experience in trauma-informed practice and cross-disciplinary care strengthens the committee’s focus on child wellbeing and family support."
- name: "Renae Murray"
  role: "Committee Member"
  image: "/assets/img/committee/renae-murray.png"
  blurb: "Renae brings a background in business operations, marketing and community engagement. As a local parent and community member, she is passionate about building strong relationships and supporting families in Bassendean."
