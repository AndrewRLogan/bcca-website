- name: "Cara"
  role: "Chairperson"
  image: "/assets/img/committee/cara.png"
  blurb: "Cara is a children’s and family lawyer and the legal practice director of a boutique family law firm. She has previously served as president and vice-president of Bassendean Primary School Playgroup and as secretary and general board member of Open Doors Youth Service. She is a driving force behind BCCA and demonstrates kind and caring leadership. She has a strong commitment to the opportunities BCCA can provide for the youngest members of the Bassendean community."
- name: "Siobhan"
  role: "Deputy Chairperson"
  image: "/assets/img/committee/siobhan-cadogan.png"
  blurb: "Siobhan is a consumer engagement coordinator with experience supporting meaningful community participation, accreditation and governance. She has played key roles in developing and implementing projects, processes and policies that affect children, young people and families. She values and champions the voices of Bassendean community members. She brings warmth, care, and professionalism to all her interactions."
- name: "Jenny"
  role: "Secretary"
  image: "/assets/img/committee/jenny-hutson.png"
  blurb: "Jenny is a Child Health Nurse. She believes all community members have a responsibility in growing the strong communities we need to build and maintain to have a positive lasting impact on our children’s health and wellbeing."
- name: "Jason"
  role: "Treasurer"
  image: "/assets/img/committee/jason.png"
  blurb: "Jason works as a management accountant. He has worked with many different organisations, including private industry and non-profit entities, across areas of data, governance and finance. His focus for the BCCA is to ensure that carefully considered plans and policies are put in place to guarantee the long-term future of the service."
- name: "Emily"
  role: "Committee Member"
  image: "/assets/img/committee/emily.png"
  blurb: "Emily is a Clinical Psychologist. She advocates passionately for the health and wellbeing of her patients. She is a proud member of the Bassendean community and brings thoughtful insight, strong interpersonal awareness, and a calm and considered approach."
- name: "Renae"
  role: "Committee Member"
  image: "/assets/img/committee/renae-murray.png"
  blurb: "Renae is a local Bassendean business owner. She is highly skilled in strategic planning and customer service and has strong connections throughout Bassendean. Renae is known for her kindness and empathy, which are evident in the relationships she builds."
