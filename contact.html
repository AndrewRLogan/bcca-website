---
layout: default
title: Contact Us
permalink: /contact/
---

<div class="card contact-card">
  <h2>Reason</h2>
  <form class="contact-form" action="https://formsubmit.co/crashbl_89@hotmail.com" method="POST">
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="_subject" value="BCCA website enquiry">
    <input type="hidden" name="_template" value="table">

    <label class="captcha-gate">
      <input type="checkbox" id="captcha-gate" name="captcha-gate">
      <span>I confirm I am not a robot.</span>
    </label>

    <select id="contact-reason" name="reason" aria-label="Reason" disabled>
      <option value="" selected>Please select</option>
      <option value="General contact">General contact</option>
      <option value="Sign up as member">Sign up as member</option>
      <option value="Offer fundraising opportunity">Offer fundraising opportunity</option>
    </select>

    <div class="reason-sections">
      <section class="reason-section" id="General contact-section" data-name="General contact">
        <h3>General contact</h3>
        <div class="email-form">
          <div class="field-group">
            <input id="general-email" type="email" name="email" placeholder="Email" required>
          </div>

          <div class="field-group">
            <input id="general-subject" type="text" name="subject" placeholder="Subject" required>
          </div>

          <div class="field-group">
            <textarea id="general-message" name="message" placeholder="Message" required></textarea>
          </div>

          <button type="submit" class="button">Send</button>
        </div>
      </section>

      <section class="reason-section" id="Sign up as member-section" data-name="Sign up as member">
        <h3>Sign up as member</h3>
        <div class="email-form">
          <div class="field-group">
            <input type="text" name="name" placeholder="Name" required>
          </div>
          <div class="field-group">
            <input type="email" name="email" placeholder="Email" required>
          </div>
          <div class="field-group">
            <textarea name="message" placeholder="Tell us how you would like to be involved" required></textarea>
          </div>
          <button type="submit" class="button">Send</button>
        </div>
      </section>

      <section class="reason-section" id="Offer fundraising opportunity-section" data-name="Offer fundraising opportunity">
        <h3>Offer fundraising opportunity</h3>
        <div class="email-form">
          <div class="field-group">
            <input type="text" name="name" placeholder="Your name" required>
          </div>
          <div class="field-group">
            <input type="email" name="email" placeholder="Email" required>
          </div>
          <div class="field-group">
            <textarea name="message" placeholder="Details of the fundraising opportunity" required></textarea>
          </div>
          <button type="submit" class="button">Send</button>
        </div>
      </section>
    </div>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const captchaGate = document.getElementById('captcha-gate');
    const reasonSelect = document.getElementById('contact-reason');
    const contactCard = document.querySelector('.contact-card');
    const form = document.querySelector('.contact-form');
    const sections = Array.from(document.querySelectorAll('.reason-section'));

    function updateReasonSections() {
      const selectedValue = reasonSelect.value;

      sections.forEach(function (section) {
        const show = section.id === selectedValue + '-section';
        section.style.display = show ? 'block' : 'none';

        section.querySelectorAll('input, textarea, button').forEach(function (field) {
          const isField = field.tagName !== 'BUTTON';
          field.disabled = !show;
          if (isField) {
            field.required = show;
          }
        });
      });
    }

    function updateSelectState() {
      reasonSelect.disabled = !captchaGate.checked;
      if (!captchaGate.checked) {
        reasonSelect.value = '';
      }
      updateReasonSections();
    }

    async function handleSubmit(event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const sendButton = document.activeElement && document.activeElement.matches('button[type="submit"]')
        ? document.activeElement
        : form.querySelector('button[type="submit"]');

      sendButton.disabled = true;
      sendButton.innerHTML = '<span class="spinner" aria-label="Sending message"></span><span>Sending</span>';

      const data = new FormData(form);

      try {
        await fetch(form.action, {
          method: 'POST',
          body: data,
          mode: 'no-cors'
        });

        await new Promise(function (resolve) {
          window.setTimeout(resolve, 600);
        });

        contactCard.innerHTML = '<div class="success-message"><h2>Thank you for your message.</h2><p>We\'ll be in touch soon.</p></div>';
      } catch (error) {
        sendButton.disabled = false;
        sendButton.innerHTML = 'Send';
      }
    }

    form.addEventListener('submit', handleSubmit);
    captchaGate.addEventListener('change', updateSelectState);
    reasonSelect.addEventListener('change', updateReasonSections);
    updateSelectState();
  });
</script>
