title: Bassendean Community Children's Association
tagline: Keeping Wind in the Willows in our community
description: >-
  Bassendean Community Children's Association Inc. is a not-for-profit
  association seeking to take over the operation of the Wind in the Willows
  childcare centre in Bassendean, Western Australia.
email: admin@bassendeancca.org.au
url: "https://andrewrlogan.github.io"
baseurl: "/bcca-website"

# Jekyll build settings — GitHub Pages builds this itself; the Gemfile is for local preview only.
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
