<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <img src="{{ '/bccalogo.jpeg' | relative_url }}" alt="Bassendean Community Children's Association logo" class="site-logo">
      <span>Bassendean Community Children's Association</span>
    </a>
    <nav class="site-nav">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"
           class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
